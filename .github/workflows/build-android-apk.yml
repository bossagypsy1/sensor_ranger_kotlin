name: Build Android Debug APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Generate Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.6 --distribution-type bin
          chmod +x gradlew

      # Pass build number as a Gradle project property (-P) so it is available
      # regardless of when the Gradle daemon was started.
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug -PbuildNumber=${{ github.run_number }}

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SensorRanger-kt-v${{ github.run_number }}.apk

      # Release steps only run on main — the workflow triggers on all branches
      # for CI, but publishing to GitHub Releases only makes sense from main.
      - name: Delete existing latest-build release
        if: github.ref == 'refs/heads/main'
        run: gh release delete latest-build --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish APK as GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "Build v${{ github.run_number }}"
          prerelease: true
          body: |
            Build v${{ github.run_number }} — commit ${{ github.sha }} on branch `${{ github.ref_name }}`.
            Download `SensorRanger-kt-v${{ github.run_number }}.apk` directly below.
          files: SensorRanger-kt-v${{ github.run_number }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
